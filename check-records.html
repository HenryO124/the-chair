<!doctype html><html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Levyjen tarkistus</title>
<style>
:root{--bg:#120a0e;--ink:#F0E7D8;--dim:#9A868D;--red:#E4182E;--ok:#5BE49A;--bad:#FF7A8A;
      --line:rgba(255,255,255,.12);--panel:rgba(255,255,255,.04)}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 60px;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:clamp(22px,4vw,30px);margin:0 0 6px}
p.sub{color:var(--dim);margin:0 0 22px}
button{background:var(--red);color:#fff;border:0;border-radius:24px;padding:13px 26px;
  font:600 16px system-ui;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#bar{height:6px;background:var(--panel);border-radius:3px;margin:20px 0 6px;overflow:hidden}
#fill{height:100%;width:0;background:var(--red);transition:width .2s}
#count{font:13px ui-monospace,monospace;color:var(--dim)}
.box{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:18px 0;background:var(--panel)}
.box h2{font-size:15px;margin:0 0 10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14.5px}
.row:first-of-type{border-top:0}
.row b{flex:0 0 38%;font-weight:600}
.row span{color:var(--dim)}
.ok{color:var(--ok)} .bad{color:var(--bad)}
textarea{width:100%;height:150px;margin-top:10px;background:#0b0609;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:10px;font:13px ui-monospace,monospace}
</style></head><body><div class="wrap">

<h1>Levyjen tarkistus</h1>
<p class="sub">Tämä sivu kysyy iTunesilta löytyykö jokainen Name the Artist -levy, ja listaa ne jotka
eivät löydy. Se kysyy sinun selaimestasi, koska vain se pääsee iTunesiin — palvelin jolla peli
rakennetaan ei pääse. Sivu ei muuta mitään; se vain katsoo.</p>

<button id="go">Tarkista levyt</button>
<div id="bar"><div id="fill"></div></div>
<div id="count"></div>
<div id="out"></div>

<script>
const $=i=>document.getElementById(i);
/* Copied from the game rather than reinvented: it is the one that turns &
   into "and", which is what lets Macklemore match "Macklemore & Ryan Lewis".
   A checker that folds differently from the thing it checks is worse than
   no checker at all. */
function fold(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // the accents themselves
    .replace(/[\u2018\u2019\u02bc\u00b4`]/g,"'")                         // every kind of apostrophe
    .replace(/[\u00f8\u00d8]/g,'o').replace(/[\u00e6\u00c6]/g,'ae')      // the ones NFD leaves alone
    .replace(/\u00df/g,'ss').replace(/[\u0142\u0141]/g,'l')
    .replace(/[\u00f0\u00de\u00fe]/g,'th')
    .toLowerCase().replace(/&/g,' and ')
    .replace(/[^a-z0-9']+/g,' ').trim();
}
/* The game's own matching, copied whole. Keeping a second copy in step by
   hand is how a checker starts disagreeing with the thing it checks. */
function nameScore(want,got){
  const a=fold(want),b=fold(got);
  if(!a||!b)return 0;
  if(a===b)return 2;
  const ta=a.split(' '),tb=b.split(' ');
  /* "The Beatles" and "Beatles" are the same act; an article is not a word. */
  const noise={the:1,los:1,las:1,le:1,la:1,die:1,der:1};
  const strip=t=>{const o=t.filter(w=>!noise[w]);return o.length?o:t};
  const sa=strip(ta),sb=strip(tb);
  if(sa.join(' ')===sb.join(' '))return 2;
  /* Run-D.M.C. folds to "run d m c" and iTunes writes "RUN DMC" -> "run dmc".
     Same act, no words in common. So compare them with the gaps closed up too;
     that is only a match when the letters are identical in order, which no two
     different acts are. */
  if(sa.join('')===sb.join(''))return 2;
  /* A one-word act name sits inside a great many other act names: Prince in
     Prince Royce, Cher in Cher Lloyd, Europe in Europe 2000, Ghost in Ghost
     Hounds. 55 of the acts in this collection have one-word names, so taking
     that containment as a perfect match plays the wrong record under the
     right name — and the room has no way of knowing. A longer name only
     counts when the extra part is a collaborator rather than a different act. */
  const joins={'&':1,and:1,feat:1,'feat.':1,featuring:1,with:1,x:1,vs:1,'vs.':1,presents:1};
  const inside=(small,big)=>{
    if(small.length>=big.length)return false;
    for(let i=0;i<small.length;i++)if(small[i]!==big[i])return false;  // a prefix
    return !!joins[big[small.length]];             // and then a collaborator
  };
  if(inside(sa,sb)||inside(sb,sa))return 2;
  const hit=sa.filter(w=>sb.indexOf(w)>=0).length;
  return hit/Math.max(sa.length,sb.length)>=0.6?1:0;
}
const same=(a,b)=>nameScore(a,b)===2;
const FAKE=/karaoke|tribute|in the style of|made popular by|instrumental version|cover version/i;
const nap=ms=>new Promise(r=>setTimeout(r,ms));

async function ask(term,tries){
  const url='https://itunes.apple.com/search?term='+encodeURIComponent(term)
    +'&entity=song&limit=12';
  for(let i=0;i<(tries||4);i++){
    try{
      const r=await fetch(url);
      if(r.status===403||r.status===429){await nap(1500*(i+1));continue}
      if(!r.ok){await nap(600);continue}
      const j=await r.json();
      return j.results||[];
    }catch(e){await nap(900*(i+1))}
  }
  return null;                       // null means "could not ask", not "not there"
}

function hit(artist,track,rows){
  if(!rows)return null;
  for(const r of rows){
    if(!r.previewUrl)continue;
    if(FAKE.test(r.artistName||'')||FAKE.test(r.trackName||''))continue;
    if(!same(artist,r.artistName))continue;
    const t=fold(track),n=fold(r.trackName);
    if(n===t||n.indexOf(t)===0||t.indexOf(n)===0)return r;
  }
  return null;
}

$('go').onclick=async()=>{
  $('go').disabled=true;$('out').innerHTML='';
  let src;
  try{
    const r=await fetch('banks.js?t='+Date.now());
    if(!r.ok)throw new Error('banks.js '+r.status);
    src=await r.text();
  }catch(e){
    $('out').innerHTML='<div class="box"><h2>Ei päässyt alkuun</h2>'
      +'Levyluetteloa ei saatu: '+e.message+'<br><br>Avaa tämä sivu osoitteesta '
      +'<b>henryo124.github.io/the-chair/check-records.html</b>, ei omalta koneelta.</div>';
    $('go').disabled=false;return;
  }
  let cat;
  try{
    /* The built file writes CATALOG= with no "var", and the rows are full of
       brackets, so find the opening bracket and count to its partner rather
       than trusting one regular expression to stop in the right place. */
    const at=src.search(/(^|[;\s])CATALOG\s*=\s*\[/m);
    if(at<0)throw new Error('CATALOG not found');
    const open=src.indexOf('[',at);
    let depth=0,end=-1,str=0;
    for(let i=open;i<src.length;i++){
      const c=src[i];
      if(str){ if(c==='\\')i++; else if(c===str)str=0; continue }
      if(c==='"'||c==="'"){str=c;continue}
      if(c==='[')depth++;
      else if(c===']'){depth--;if(!depth){end=i;break}}
    }
    if(end<0)throw new Error('CATALOG does not close');
    // the generated blocks end with a trailing comma, which JSON will not take
    cat=JSON.parse(src.slice(open,end+1).replace(/,(\s*\])\s*$/,'$1'));
  }catch(e){
    $('out').innerHTML='<div class="box"><h2>Levyluetteloa ei saatu luettua</h2>'+e.message+'</div>';
    $('go').disabled=false;return;
  }

  const dead=[],unsure=[];let done=0,okN=0;
  for(const a of cat){
    const artist=a[0],track=a[5];            // the game plays the DEBUT release
    const rows=await ask(artist+' '+track);
    let h=hit(artist,track,rows);
    if(!h&&rows)h=hit(artist,track,await ask(artist));
    done++;
    if(rows===null)unsure.push([artist,track]);
    else if(h)okN++;
    else dead.push([artist,track,a[6]]);
    $('fill').style.width=(done/cat.length*100)+'%';
    $('count').textContent=done+' / '+cat.length+'   —   löytyi '+okN
      +(dead.length?',  ei löytynyt '+dead.length:'')
      +(unsure.length?',  ei voitu kysyä '+unsure.length:'');
    await nap(220);                          // iTunes rate-limits; this keeps it happy
  }

  // iTunes throttles, and a throttled record is not a missing one. Go back for
  // the ones it would not answer, slowly, rather than making you run the whole
  // list again.
  if(unsure.length){
    $('count').textContent='Kysytään uudelleen '+unsure.length+' levyä, hitaammin…';
    const again=unsure.splice(0,unsure.length);
    let i=0;
    for(const [artist,track] of again){
      await nap(1400);
      const rows=await ask(artist+' '+track,6);
      i++;
      if(rows===null){unsure.push([artist,track]);continue}
      let h=hit(artist,track,rows);
      if(!h)h=hit(artist,track,await ask(artist,6));
      if(h)okN++; else dead.push([artist,track,'']);
      $('count').textContent='Toinen kierros '+i+' / '+again.length
        +'   —   löytyi '+okN+',  ei löytynyt '+dead.length
        +(unsure.length?',  yhä vastaamatta '+unsure.length:'');
    }
  }

  let html='<div class="box"><h2>Tulos</h2>'
    +'<div class="row"><b class="ok">Soi</b><span>'+okN+' levyä '+cat.length+'stä</span></div>'
    +'<div class="row"><b class="bad">Ei löydy</b><span>'+dead.length+'</span></div>'
    +(unsure.length?'<div class="row"><b>Ei voitu kysyä</b><span>'+unsure.length
      +' — kokeile uudelleen, iTunes rajoitti kyselyitä</span></div>':'')+'</div>';
  if(dead.length){
    html+='<div class="box"><h2>Nämä eivät soi — kierros olisi hiljainen</h2>';
    dead.forEach(d=>{html+='<div class="row"><b>'+d[0]+'</b><span>'+d[1]+(d[2]?' ('+d[2]+')':'')+'</span></div>'});
    html+='<textarea readonly>'+dead.map(d=>d[0]+'  |  '+d[1]).join('\n')+'</textarea>'
      +'<p class="sub" style="margin:10px 0 0">Kopioi tämä ja lähetä se minulle, niin poistan tai korjaan ne.</p></div>';
  }else{
    html+='<div class="box"><h2>Ei yhtään hiljaista levyä</h2>Koko luettelo soi.</div>';
  }
  $('out').innerHTML=html;
  $('go').disabled=false;
};
</script></div></body></html>
