<!doctype html><html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuvien hyväksyntä</title>
<style>
:root{--bg:#120a0e;--ink:#F0E7D8;--dim:#9A868D;--red:#E4182E;--ok:#5BE49A;
      --line:rgba(255,255,255,.13);--panel:rgba(255,255,255,.04)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(18,10,14,.96);
  border-bottom:1px solid var(--line);padding:12px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700}
#tally{font:13px ui-monospace,monospace;color:var(--dim);margin-left:auto}
main{max-width:900px;margin:0 auto;padding:18px 16px 140px}
figure{margin:0 0 10px;background:#0b0609;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;min-height:220px;display:grid;place-items:center}
img{max-width:100%;max-height:62vh;display:block}
.subject{font-size:clamp(20px,3.4vw,27px);font-weight:800;margin:14px 0 2px}
.why{color:var(--dim);font-size:14px}
.why b{color:#FFB38A;font-weight:600}
.file{font:11.5px ui-monospace,monospace;color:#6f5d63;margin-top:4px;word-break:break-all}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,10,14,.97);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:12px;justify-content:center}
.bar button{flex:1 1 0;max-width:320px;border:0;border-radius:26px;padding:16px;
  font:700 17px system-ui;cursor:pointer}
#no{background:var(--panel);color:var(--dim);border:1px solid var(--line)}
#yes{background:var(--ok);color:#06220f}
#done{padding:26px;text-align:center}
textarea{width:100%;height:190px;margin-top:14px;background:#0b0609;color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:12px;
  font:12.5px ui-monospace,monospace}
.hint{color:var(--dim);font-size:13.5px;margin-top:10px}
kbd{background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:1px 6px;font:12px ui-monospace,monospace}
</style></head><body>

<header>
  <h1>Kuvien hyväksyntä</h1>
  <span id="tally"></span>
</header>

<main>
  <div id="card">
    <figure><img id="img" alt=""></figure>
    <div class="subject" id="subject"></div>
    <div class="why" id="why"></div>
    <div class="file" id="file"></div>
  </div>
  <div id="done" hidden>
    <h2>Valmis</h2>
    <p class="hint">Kopioi tämä ja lähetä se minulle.</p>
    <textarea id="out" readonly></textarea>
  </div>
</main>

<div class="bar" id="bar">
  <button id="no">Ei kelpaa</button>
  <button id="yes">Kelpaa</button>
</div>

<script>

const $=i=>document.getElementById(i);
const KEY='thechair.review';
let seen={};
try{seen=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){seen={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(seen))}catch(e){}};

const left=()=>ROWS.filter(r=>!(r.file in seen));
let cur=null;

function draw(){
  const rest=left();
  const yes=Object.values(seen).filter(v=>v==='yes').length;
  const no=Object.values(seen).filter(v=>v==='no').length;
  $('tally').textContent=yes+' kelpaa · '+no+' ei · '+rest.length+' jäljellä';
  if(!rest.length){
    $('card').hidden=true;$('bar').hidden=true;$('done').hidden=false;
    $('out').value=JSON.stringify(ROWS.filter(r=>seen[r.file]==='yes')
      .map(r=>({subject:r.subject,topic:r.topic,file:r.file})),null,1);
    return;
  }
  cur=rest[0];
  $('img').onerror=()=>{$('img').removeAttribute('src');
    $('img').alt='Kuva ei latautunut — hylkää tämä';};
  $('img').src=cur.url;
  $('img').alt=cur.subject;
  $('subject').textContent=cur.subject+(cur.topic?'  ·  '+cur.topic:'');
  $('why').innerHTML='Kone hylkäsi: <b>'+cur.why.replace(/[<>&]/g,'')+'</b>';
  $('file').textContent=cur.file;
}
const mark=v=>{if(!cur)return;seen[cur.file]=v;save();draw()};
$('yes').onclick=()=>mark('yes');
$('no').onclick=()=>mark('no');
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='y')mark('yes');
  if(e.key==='ArrowLeft'||e.key==='n')mark('no');
});
draw();
</script></body></html>
